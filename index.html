<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Digital</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .calculator-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .calculator {
            background: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 380px;
        }
        .display {
            background: #333;
            border-radius: 10px;
            padding: 20px;
            font-size: 28px;
            text-align: right;
            margin-bottom: 15px;
            word-wrap: break-word;
            box-shadow: inset 0 0 5px #000;
            min-height: 50px;
        }
        .button-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .button-group button {
            padding: 18px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background-color: #4a4a4a;
            color: white;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .button-group button:hover {
            background-color: #666;
            transform: translateY(-2px);
        }
        .button-group button.operator {
            background-color: #28a745;
        }
        .button-group button.operator:hover {
            background-color: #218838;
        }
        .button-group button.reset {
            background-color: #dc3545;
        }
        .button-group button.reset:hover {
            background-color: #c82333;
        }
        .button-group button.delete {
            background-color: #ffc107;
            color: #000;
        }
        .button-group button.delete:hover {
            background-color: #e0a800;
        }
        .history {
            margin-top: 20px;
            width: 100%;
            max-height: 180px;
            overflow-y: auto;
            background: #2b2b2b;
            border-radius: 10px;
            padding: 10px;
            font-size: 14px;
        }
        .history-item {
            margin-bottom: 5px;
        }
        .clear-history {
            margin-top: 10px;
            background-color: #ff5722;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s, transform 0.2s;
        }
        .clear-history:hover {
            background-color: #e64a19;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <div class="display" id="display">0</div>
            <div class="button-group">
                <button onclick="append('(')">(</button>
                <button onclick="append(')')">)</button>
                <button onclick="percent()">%</button>
                <button onclick="sqrt()">√</button>

                <button onclick="append('7')">7</button>
                <button onclick="append('8')">8</button>
                <button onclick="append('9')">9</button>
                <button class="operator" onclick="appendOperator('÷')">÷</button>

                <button onclick="append('4')">4</button>
                <button onclick="append('5')">5</button>
                <button onclick="append('6')">6</button>
                <button class="operator" onclick="appendOperator('×')">×</button>

                <button onclick="append('1')">1</button>
                <button onclick="append('2')">2</button>
                <button onclick="append('3')">3</button>
                <button class="operator" onclick="appendOperator('-')">-</button>

                <button onclick="append('0')">0</button>
                <button onclick="append('.')">.</button>
                <button onclick="calculate()">=</button>
                <button class="operator" onclick="appendOperator('+')">+</button>

                <button onclick="square()">x²</button>
                <button onclick="power()">xʸ</button>
                <button class="reset" onclick="clearDisplay()">C</button>
                <button class="delete" onclick="deleteLast()">⌫</button>
                <button class="reset" onclick="clearHistory()" style="grid-column: span 4;">Hapus Riwayat</button>
            </div>
            <div class="history" id="history">
                <strong>Riwayat:</strong>
                <div id="history-list"></div>
            </div>
        </div>
    </div>

<footer style="margin-top: 30px; text-align: center; font-size: 12px; color: #999; width: 100%; max-width: 360px; padding: 10px 0;">
    <div style="margin-bottom: 8px;">
        Dibuat oleh <strong>Iball</strong> © 2025
    </div>
    <div>
        <a href="https://www.instagram.com/mhmdiqball14_" target="_blank" style="margin: 0 8px;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram" width="20" height="20">
        </a>
        <a href="https://github.com/iball30" target="_blank" style="margin: 0 8px;">
            <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub" width="20" height="20">
        </a>
        <a href="https://t.me/Iballxz" target="_blank" style="margin: 0 8px;">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="Telegram" width="20" height="20">
        </a>
    </div>
</footer>

<script>
    let display = document.getElementById('display');
    let historyList = document.getElementById('history-list');
    let expression = '';
    let calculated = false;

    function append(value) {
        expression += value;
        calculated = false;
        updateDisplay();
    }

    function appendOperator(op) {
        if (expression === '') return;
        const lastChar = expression.trim().slice(-1);
        if ('+-×÷**'.includes(lastChar)) return;
        expression += op;
        calculated = false;
        updateDisplay();
    }

    function calculate() {
        try {
            let safeExpr = expression.replace(/×/g, '*').replace(/÷/g, '/');
            let result = eval(safeExpr);
            result = Math.round((result + Number.EPSILON) * 1000000000) / 1000000000;

            if (!calculated) {
                addHistory(`${expression} = ${result}`);
                calculated = true;
            }

            expression = result.toString();
            updateDisplay();
        } catch (e) {
            alert('Error dalam perhitungan!');
            clearDisplay();
        }
    }

    function percent() {
        if (expression === '') return;
        try {
            expression = (eval(expression) / 100).toString();
            updateDisplay();
        } catch {
            alert('Error!');
        }
    }

    function sqrt() {
        if (expression === '') return;
        try {
            expression = Math.sqrt(eval(expression)).toString();
            updateDisplay();
        } catch {
            alert('Error!');
        }
    }

    function square() {
        if (expression === '') return;
        try {
            expression = Math.pow(eval(expression), 2).toString();
            updateDisplay();
        } catch {
            alert('Error!');
        }
    }

    function power() {
        if (expression === '') return;
        expression += '**';
        updateDisplay();
    }

    function clearDisplay() {
        expression = '';
        calculated = false;
        updateDisplay();
    }

    function deleteLast() {
        expression = expression.slice(0, -1);
        calculated = false;
        updateDisplay();
    }

    function updateDisplay() {
        display.textContent = expression || '0';
    }

    function addHistory(text) {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.textContent = text;
        historyList.prepend(item);
    }

    function clearHistory() {
        historyList.innerHTML = '';
    }
</script>
</body>
</html>
